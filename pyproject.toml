[project]
name = "solary-backend"
version = "0.1.0"
description = "Backend de autenticación de Solary migrado a Python (FastAPI)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "greenlet>=3.1",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "bcrypt>=4.2",
    "slowapi>=0.1.9",
    "email-validator>=2.2",
    "python-multipart>=0.0.12",
    "httpx>=0.28",
    "google-auth>=2.38",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "asgi-lifespan>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4"]
ignore = ["S101"]  # assert permitido en tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
warn_unused_ignores = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
