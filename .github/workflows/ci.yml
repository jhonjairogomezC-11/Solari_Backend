name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # Valores ficticios: solo para que app/core/config.py cargue la configuración.
      # Las pruebas que corren aquí no abren conexiones a la base de datos.
      JWT_SECRET: ci-dummy-secret-not-real-0123456789abcdef
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/voluntapp_ci
      APP_ENV: ci
      GOOGLE_CLIENT_ID: ""
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv y Python 3.14
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync

      # El código actual tiene errores previos de estas reglas (líneas largas,
      # orden de imports, comprensiones, S608/S311 en tests de integración).
      # Se ignoran para que el paso bloquee solo errores nuevos de otras reglas.
      # Quitar códigos de esta lista a medida que se corrijan.
      - name: Ruff
        run: uv run ruff check app tests --extend-ignore E501,I001,C416,C408,S608,S311

      # tests/integration y tests/test_auth_flow.py necesitan PostgreSQL
      # (fixtures db_engine/client de tests/conftest.py), así que se excluyen.
      - name: Pruebas unitarias (sin base de datos)
        run: >-
          uv run pytest -q
          --ignore=tests/integration
          --ignore=tests/test_auth_flow.py
